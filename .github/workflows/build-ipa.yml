name: Build IPA (GitHub-hosted runner)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: brew install ldid make zip

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Build IPA
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          BOOTJDK=""
          if /usr/libexec/java_home -v 1.8 >/dev/null 2>&1; then
            JH=$(/usr/libexec/java_home -v 1.8)
            if "$JH/bin/javac" -version 2>&1 | grep -q '1\.8\.0'; then BOOTJDK="$JH/bin"; fi
          fi
          if [ -z "$BOOTJDK" ]; then BOOTJDK="$JAVA_HOME/bin"; fi
          echo "Using BOOTJDK=$BOOTJDK"
          "$BOOTJDK/javac" -version
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 BOOTJDK="$BOOTJDK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ios-unsigned-ipa
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa

      - name: Upload java_runtimes
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-java-runtimes
          path: artifacts/java_runtimes.zip

      - name: Publish IPA to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-$(date +%Y%m%d-%H%M)"
          IPA=$(ls artifacts/org.angelauramc.amethyst-*-ios.ipa | head -1)
          gh release create "$TAG" "$IPA#Amethyst-iOS-unsigned.ipa" \
            --title "Amethyst iOS build $TAG" \
            --notes "Unsigned IPA built from commit $GITHUB_SHA. Sign with Sideloadly." \
            --prerelease
